services:
  db:
    image: postgres:17
    container_name: my_backend_db
    restart: always
    environment:
      - POSTGRES_USER=focus_app
      - POSTGRES_PASSWORD=focus_password_strong123
      - POSTGRES_DB=focus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: