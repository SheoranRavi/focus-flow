services:

  api:
    image: ghcr.io/sheoranravi/task-quota/focus-api:${IMAGE_TAG:-latest}
    container_name: focus-flow-api
    restart: unless-stopped

    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_API_BASE_URL: ${RAZORPAY_API_BASE_URL}
      RAZORPAY_PLAN_ID_INR: ${RAZORPAY_PLAN_ID_INR}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"


  postgres:
    image: postgres:17
    container_name: focus-flow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  

  caddy:
    image: caddy:2
    container_name: focus-flow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api


volumes:
  postgres_data:
  caddy_data:
  caddy_config: